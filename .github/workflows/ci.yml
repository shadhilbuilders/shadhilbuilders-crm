name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SECOND-ROUND AUDIT (AR-3/AR-4): workflows moved from apps/web/.github to the
# repo root (GitHub only reads root workflows in a monorepo) and repaired:
#   - .nvmrc replaced by node-version from package.json engines
#   - format:check / test:coverage referenced scripts that didn't exist
#   - RLS matrix: CI provisions Postgres + applies the init migration, and the
#     never-skip guard makes a missing DB a FAILURE, not a silent skip
# CI never talks to a real provider - placeholder-shaped vars only.
#
# 2026-08-31 (first green effort): the generated Prisma client is gitignored
# by design, so every job that compiles/imports @shadhil/database sources
# must run `prisma generate` first. The RLS matrix also bootstraps the
# non-owner role `shadhil_app` (normally created by docker/postgres-init/
# 00-init.sql on volume init - CI's service container has no entrypoint
# hook) BEFORE prisma migrate deploy, because migration 1 GRANTs to it.
env:
  SKIP_ENV_VALIDATION: 'true'
  NODE_ENV: test
  NEXT_PUBLIC_API_BASE_URL: https://api.example.com/v1
  NEXT_PUBLIC_APP_NAME: Shadhil
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_DEBUG_MODE: false
  # Build-time env for `next build` (the type-check/lint/test/build jobs all run
  # the web build, and NONE of them has a repo-root `.env` - it is gitignored and
  # absent on a fresh runner). Both env validators fail the build without these:
  # `@t3-oss/env-nextjs` in `apps/web/src/lib/env/env.ts` (surfacing as
  # "Failed to collect page data for /api/docs") and `assertAuthEnv()` at module
  # scope in `packages/auth-client/src/env.ts` (surfacing for whatever page first
  # imports the auth client, e.g. "/[orgSlug]/my-teams").
  #
  # Values must be REAL-shaped, not absent: SKIP_ENV_VALIDATION does not help
  # here. Turborepo's env mode does not forward a shell var unless it is in
  # `globalEnv`, and even adding it there only uncovers assertAuthEnv, which has
  # no skip switch at all. Every var below is already in turbo.json globalEnv, so
  # turbo passes it through to the task.
  #
  # DIRECT_DATABASE_URL is validated only - `next build` never connects (verified
  # with an unreachable placeholder), so the build job needs no postgres service.
  BETTER_AUTH_SECRET: ci-build-better-auth-secret-not-a-real-secret
  BETTER_AUTH_URL: http://localhost:8080
  JWT_SECRET: ci-build-jwt-secret-not-a-real-secret-000000
  JWT_ISSUER: shadhil-ci
  DIRECT_DATABASE_URL: postgresql://ci_build:ci_build@localhost:5432/ci_build?schema=public

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shadhil/database generate
      # next typegen emits .next/types/routes.d.ts, which declares the
      # RouteContext<'/route'> helper that route handlers in src/app/api/**
      # use for their second argument. Without this step a fresh checkout
      # has no generated types, and tsc fails with
      # "Cannot find name 'RouteContext'" (the type is only created by
      # next dev / next build / next typegen - not by pnpm install).
      - run: pnpm --filter @shadhil/web typegen
      - run: pnpm type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shadhil/database generate
      - run: pnpm lint

  # T-G1 verify item: "lint rule/grep CI check banning bare prisma in
  # controllers". Node script (no DB, ~1s) - scans apps/backend/src for
  # bare prisma-client imports that never pass the client into
  # withRlsContext. Sanctioned paths (webhook ingest, system cron,
  # better-auth session lookup) live in the script's ALLOWLIST with a
  # documented why.
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-bare-prisma.mjs

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # T-TEST-DB-ISOLATION (2026-09-16): this job had NO database, so every
    # DB-backed suite silently took its `skipIf(!HAS_DB)` path. A green run meant
    # "the fixtures never executed". It now gets postgres + a dedicated
    # `shadhil_crm_test` database, matching local, and the suites really run.
    env:
      SHADHIL_APP_PASSWORD: shadhil
      SHADHIL_OWNER_PASSWORD: shadhil
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shadhil
          POSTGRES_PASSWORD: shadhil
          POSTGRES_DB: shadhil_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadhil -d shadhil_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same role bootstrap as rls-matrix: migration 1 GRANTs to shadhil_app.
      - run: |
          PGPASSWORD=${SHADHIL_OWNER_PASSWORD} psql -h localhost -U shadhil -d shadhil_crm -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE shadhil_app LOGIN PASSWORD 'shadhil' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          SQL
      - run: pnpm --filter @shadhil/database generate
      # Create + migrate + seed the TEST database. Tests refuse to run against a
      # non-`_test` database (packages/database/src/test-db-isolation.ts), so this
      # step is what makes the isolation real rather than nominal.
      - run: |
          PGPASSWORD=${SHADHIL_OWNER_PASSWORD} psql -h localhost -U shadhil -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE shadhil_crm_test;
          SQL
      - run: cd packages/database && npx prisma migrate deploy
        env:
          DIRECT_DATABASE_URL: postgresql://shadhil:${{ env.SHADHIL_OWNER_PASSWORD }}@localhost:5432/shadhil_crm_test?schema=public
      - run: cd packages/database && pnpm exec tsx src/seed.ts
        env:
          DIRECT_DATABASE_URL: postgresql://shadhil:${{ env.SHADHIL_OWNER_PASSWORD }}@localhost:5432/shadhil_crm_test?schema=public
          DATABASE_URL: postgresql://shadhil_app:${{ env.SHADHIL_APP_PASSWORD }}@localhost:5432/shadhil_crm_test?schema=public
      # Day 5 T-G4: @shadhil/database exports point to ./dist/index.js.
      # The test job runs vitest which imports from the workspace;
      # the import resolves to dist (per package.json `main`), not
      # src. With turbo's default concurrency=10, the auth-client
      # build can race the database build on a cold cache and
      # fail with TS2307 'Cannot find module @shadhil/database'.
      # Two fixes layered here:
      #   (1) Build the database explicitly first so dist/ exists
      #       on disk before any test/build task runs.
      #   (2) Run all other package builds serially
      #       (`--concurrency=1`) so the dep chain is always honored.
      - run: pnpm --filter @shadhil/database build
      - run: pnpm exec turbo run build --concurrency=1
      # `--concurrency=1` for the same reason as the build above. `test` declares
      # `dependsOn: ["^build"]`, so `pnpm test` runs each package's build first -
      # and at the default concurrency=10 turbo schedules a dependent build as
      # soon as its dependency is SCHEDULED, not finished. Observed in CI
      # 2026-10-01: @shadhil/auth's tsc started while @shadhil/database was still
      # emitting (both log `clean` at 01:37:03), and died with
      # "src/auth.ts(30,24): error TS2307: Cannot find module '@shadhil/database'"
      # - which turbo reported as the `pnpm test` step failing. It passes locally
      # with a warm dist, which is exactly why the ordering has to be forced.
      - run: pnpm test --concurrency=1
      # Backend has ZERO tests until T-RLSREAL lands - keep passWithNoTests
      # true for now so bundle-1 fixes can ship; the plan flips it to false
      # in the same PR as the first real backend test (AR-5).
      #
      # The DB env is repeated here on purpose. The migrated database above is
      # useless without it: this runner has no repo-root `.env` (gitignored), and
      # with DATABASE_URL unset every DB-backed suite takes its
      # `describe.skipIf(!HAS_DB)` path - the exact silent skip this job exists to
      # prevent. Measured on a CI-faithful tree (2026-09-30): 139 of 171 tests in
      # `@shadhil/database` FAIL, because the two files that build a Prisma client
      # at module scope throw at import ("SASL: SCRAM-SERVER-FIRST-MESSAGE: client
      # password must be a string") before any skip guard can run.
      # RLS_MATRIX_REQUIRED makes a future env regression fail loudly instead of
      # degrading back to a green no-op (same guard the rls-matrix job uses).
      - run: pnpm test
        env:
          DIRECT_DATABASE_URL: postgresql://shadhil:${{ env.SHADHIL_OWNER_PASSWORD }}@localhost:5432/shadhil_crm_test?schema=public
          DATABASE_URL: postgresql://shadhil_app:${{ env.SHADHIL_APP_PASSWORD }}@localhost:5432/shadhil_crm_test?schema=public
          RLS_MATRIX_REQUIRED: 'true'

  rls-matrix:
    name: RLS Isolation Matrix
    runs-on: ubuntu-latest
    env:
      # shadhil_app password matches the PASSWORD literal in the
      # CREATE ROLE heredoc below; both must change together.
      SHADHIL_APP_PASSWORD: shadhil
      # shadhil (owner) password matches DIRECT_DATABASE_URL below
      # and the postgres service POSTGRES_PASSWORD env above.
      SHADHIL_OWNER_PASSWORD: shadhil
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shadhil
          POSTGRES_PASSWORD: shadhil
          POSTGRES_DB: shadhil_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadhil -d shadhil_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 00-init.sql equivalent: CI's bare postgres container has no
      # docker-entrypoint hook, so create the non-owner app role here
      # (AR-1) BEFORE migrations - migration 1's policy block GRANTs to it.
      # Use 'psql' directly against localhost:5432 (the service's exposed
      # port). Heredoc-quoting on purpose: $$ in YAML run-blocks gets
      # shell-expanded ($\$$ landed as the runner PID last run ->
      # 'unterminated dollar-quoted string'). Fresh container per run,
      # so no IF NOT EXISTS needed.
      - run: |
          PGPASSWORD=${SHADHIL_OWNER_PASSWORD} psql -h localhost -U shadhil -d shadhil_crm -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE shadhil_app LOGIN PASSWORD 'shadhil' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          SQL
      - run: pnpm --filter @shadhil/database generate
      # T-TEST-DB-ISOLATION (2026-09-16): the matrix runs against
      # `shadhil_crm_test`, not the dev database, on BOTH local and CI. The
      # helper rewrites the database NAME to `<name>_test`, so this job must
      # create and migrate that database - otherwise every query fails with
      # "no such database: shadhil_crm_test".
      - run: |
          PGPASSWORD=${SHADHIL_OWNER_PASSWORD} psql -h localhost -U shadhil -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE shadhil_crm_test;
          SQL
      # 00-init.sql equivalent + schema + policies + FORCE + grants
      - run: cd packages/database && npx prisma migrate deploy
        env:
          # NOTE: GH Actions does NOT shell-expand ${VAR} inside env: map
          # values - that's bash syntax. Use the ${{ }} expression form or
          # Prisma gets the literal '${...}' as the password (P1000).
          DIRECT_DATABASE_URL: postgresql://shadhil:${{ env.SHADHIL_OWNER_PASSWORD }}@localhost:5432/shadhil_crm_test?schema=public
      # AR-4 companion: the matrix FAILS if the DB is unreachable - a missing
      # DATABASE_URL must never silently skip the security suite.
      - run: cd packages/database && pnpm test
        env:
          # DIRECT for migrate/seed (owner role has BYPASSRLS for DDL);
          # DATABASE for the runtime adapter (the @shadhil/database client
          # is RLS-enforced and must connect as the non-owner shadhil_app
          # role - using shadhil here bypasses RLS and the matrix flips
          # green for the wrong reason).
          DIRECT_DATABASE_URL: postgresql://shadhil:${{ env.SHADHIL_OWNER_PASSWORD }}@localhost:5432/shadhil_crm_test?schema=public
          DATABASE_URL: postgresql://shadhil_app:${{ env.SHADHIL_APP_PASSWORD }}@localhost:5432/shadhil_crm_test?schema=public
          RLS_MATRIX_REQUIRED: 'true'


  # Playwright e2e against real servers + a real Postgres.
  #
  # WHY THIS EXISTS: e2e was never in CI, and the suite rotted silently - a
  # clean-tree baseline on 2026-09-16 was 9 failed / 5 passed / 5 skipped
  # (demo-flow.spec.ts and leads-full.spec.ts), none of which anyone could see.
  # A suite nobody runs is not a safety net.
  #
  # Mirrors the rls-matrix job's service + role bootstrap. Every env var below
  # mirrors what the local .env provides; the seeded demo login
  # (demo@shadhilbuilders.in / demo123) is created by scripts/setup-demo-user.ts
  # and is already committed in demo-flow.spec.ts as the sanctioned local fixture.
  #
  # NOTE: unlike rls-matrix this job deliberately DOES connect the backend as the
  # RLS-enforced `shadhil_app` role, because the specs assert real role-scoped
  # behaviour (a telecaller's queue, a manager's approvals). That means every
  # migration must GRANT to shadhil_app, which migration 1 already does.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      # shadhil_app password matches the CREATE ROLE heredoc; shadhil (owner)
      # matches the postgres service and DIRECT_DATABASE_URL below.
      SHADHIL_APP_PASSWORD: shadhil
      SHADHIL_OWNER_PASSWORD: shadhil
      # MUST be production, not development: a production `next build` only
      # succeeds with NODE_ENV=production. With `development` it fails
      # prerendering "/" (NextTopLoader/global-error read a null React context),
      # which is an environment artifact, not a code defect - verified locally
      # 2026-09-16 (exit 1 with development, exit 0 with production).
      NODE_ENV: production
      # Backend boot-env (apps/backend/src/boot-env.ts) fails fast on any of
      # these being missing, so a blank one makes the server exit rather than
      # start half-dead. Secret values here are throwaway CI placeholders -
      # CI never talks to a real provider, same convention as the rest of this file.
      JWT_SECRET: ci-e2e-jwt-secret-not-a-real-secret-0000
      JWT_ISSUER: shadhil-ci
      BETTER_AUTH_SECRET: ci-e2e-better-auth-secret-not-real-0000
      BETTER_AUTH_URL: http://localhost:8080
      POOL_MODE: session
      PUBLIC_API_KEY: ci-e2e-public-api-key-placeholder
      # PUBLIC_ORG_ID must be a 26-char ULID or 36-char UUID (boot-env rejects
      # anything else) and must be the org the seeded demo rows belong to.
      # It is NOT DEMO_ORG_ID: that cuid2 (`j6lic67mwuop8ur7epjylexz`) is 24
      # chars, because cuid2 - the repo's id standard - always is. The demo
      # tenant cannot satisfy a 26/36 check at all.
      #
      # The seeded bootstrap org (`SEED_ORG_ID` in packages/database/src/seed.ts,
      # a deliberately curated 26-char cuid2 that passes both z.cuid2 and this
      # rule) is the org `seed` creates, so it is the only value here that is
      # both valid and real. Correct because PUBLIC_ORG_ID's consumers are the
      # public/unauthenticated write paths only (public leads intake, webhooks,
      # overdue-alert scans) - the e2e specs are all authenticated and never touch
      # them. It must stay a real org id: an invalid one would make the synthetic
      # RLS context match no rows.
      PUBLIC_ORG_ID: ceid01lpfe1esm8jwsxid41k28
      CORS_ORIGINS: http://localhost:3000
      # WhatsApp Cloud API. `WhatsAppClient.fromEnv()` THROWS at module init when
      # WA_ACCESS_TOKEN / WA_PHONE_NUMBER_ID are absent ("we want the failure to
      # be loud at module init, not on first send"), and it is constructed in
      # WebhooksModule's factory - so the whole API refuses to boot without them.
      # Throwaway CI placeholders, same convention as the rest of this block: CI
      # never talks to Meta. Telegram and VAPID are deliberately left out - those
      # services degrade to a logged warning instead of throwing.
      WA_ACCESS_TOKEN: ci-e2e-wa-access-token-placeholder
      WA_PHONE_NUMBER_ID: ci-e2e-wa-phone-number-id-placeholder
      WA_WEBHOOK_VERIFY_TOKEN: ci-e2e-wa-webhook-verify-token-placeholder
      # Frontend. The web app proxies to the backend through /api/bff.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_APP_NAME: Shadhil
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_DEBUG_MODE: 'false'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shadhil
          POSTGRES_PASSWORD: shadhil
          POSTGRES_DB: shadhil_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadhil -d shadhil_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Required: RedisService throws at boot when REDIS_URL is unset, and the
      # backend's assertBootEnv requires it too.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser download is the slow part; cache it across runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @shadhil/web exec playwright install --with-deps chromium
      # CI's bare postgres container has no docker-entrypoint hook, so create the
      # non-owner app role BEFORE migrations (migration 1 GRANTs to it).
      - run: |
          PGPASSWORD=${SHADHIL_OWNER_PASSWORD} psql -h localhost -U shadhil -d shadhil_crm -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE shadhil_app LOGIN PASSWORD 'shadhil' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          SQL
      - run: pnpm --filter @shadhil/database generate
      # Env for every subsequent step. No PgBouncer here, so the pooler vars point
      # straight at the service port (Prisma tolerates ?pgbouncer=true on a direct
      # connection). DATABASE_URL uses the RLS-enforced app role on purpose;
      # DIRECT_DATABASE_URL uses the owner role for DDL.
      - name: Export e2e database env
        run: |
          {
            echo "DATABASE_URL=postgresql://shadhil_app:${SHADHIL_APP_PASSWORD}@localhost:5432/shadhil_crm?schema=public&pgbouncer=true"
            echo "DIRECT_DATABASE_URL=postgresql://shadhil:${SHADHIL_OWNER_PASSWORD}@localhost:5432/shadhil_crm?schema=public"
            echo "REDIS_URL=redis://localhost:6379"
            echo "API_PORT=8080"
          } >> "$GITHUB_ENV"
      - run: cd packages/database && npx prisma migrate deploy
      # Seed the org/project/units + the 10 demo leads, then the demo login the
      # specs use. The e2e specs assert against THIS roster
      # (Demo Priya / Demo Arjun / ... via scripts/setup-demo-user.ts and the
      # 10-lead set in src/seed.ts).
      - run: pnpm --filter @shadhil/database seed
      - run: pnpm --filter @shadhil/database setup-demo-user
      # Build the workspace so the backend can run, then start both servers in
      # the background and wait for real readiness instead of sleeping.
      - run: pnpm --filter @shadhil/database build
      - run: pnpm exec turbo run build --filter=@shadhil/backend --filter=@shadhil/web --concurrency=1
      - name: Start backend
        run: |
          pnpm --filter @shadhil/backend start > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "backend ready"; exit 0
            fi
            sleep 2
          done
          echo "backend failed to become ready"; tail -60 /tmp/backend.log; exit 1
      - name: Start web
        run: |
          pnpm --filter @shadhil/web start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/login; then
              echo "web ready"; exit 0
            fi
            sleep 2
          done
          echo "web failed to become ready"; tail -60 /tmp/web.log; exit 1
      - run: pnpm --filter @shadhil/web exec playwright test --project=chromium
      # Upload the failure screenshots Playwright already captures - without this
      # a red CI run is unreadable.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: |
            apps/web/test-results/
            apps/web/src/test/e2e/__screenshots__/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shadhil/database generate
      # (build) - Run turbo with --concurrency=1 so workspace package
      # builds (@shadhil/database, @shadhil/auth, @shadhil/offline-store,
      # @shadhil/api-types) complete fully before the consuming apps
      # (@shadhil/backend, @shadhil/web) start their tsc.
      #
      # Default turbo concurrency is 10, which schedules dependent tasks
      # to start as soon as a dep is *scheduled* rather than *finished*.
      # On this monorepo that means @shadhil/backend's `nest build` (or
      # @shadhil/web's `next build`) can start while @shadhil/auth's
      # `tsc` is still running, erroring with TS2307 "Cannot find module
      # '@shadhil/auth'" because the dist isn't on disk yet. Serial
      # execution forces the topological order to be honored.
      #
      # Cost: ~2m on a fresh runner vs ~15s with concurrency=10 on local
      # dev. CI accepts that cost; the bug it avoids is a hard failure.
      - run: pnpm exec turbo run build --concurrency=1