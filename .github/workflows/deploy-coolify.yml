name: deploy-coolify

# Builds the three production images and redeploys the Coolify service.
# Runs on push to main when app/docker-relevant files change.
#
# Requires repo secrets (set once):
#   COOLIFY_TOKEN   - Coolify API token scoped write+deploy (CI token)
# After the first run, also verify: package visibility (GHCR org), and
# that the Coolify service pulls the pushed :<sha> tag (compose default
# is prod-<shortsha>; the workflow PATCHes the service env IMAGE_TAG
# before restarting so no manual compose edit is needed).

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker/**'
      - '.github/workflows/deploy-coolify.yml'

concurrency:
  group: deploy-coolify
  cancel-in-progress: false

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "tag=prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build + push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shadhil-crm-api:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/shadhil-crm-api:prod

      - name: Build + push sse image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/realtime-sse/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shadhil-crm-sse:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/shadhil-crm-sse:prod

      - name: Build + push web image (prod build args)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=https://crm.shadhilbuilders.in
            NEXT_PUBLIC_API_BASE_URL=https://api.crm.shadhilbuilders.in
            BACKEND_API_URL=http://shadhil-api:8080
          tags: |
            ghcr.io/${{ github.repository_owner }}/shadhil-crm-web:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/shadhil-crm-web:prod

      - name: Update IMAGE_TAG + restart the Coolify service
        run: |
          set -euo pipefail
          SVC="0bjahklz8gtdtr4do4r7ae6m"
          BASE="https://coolify.shadhilbuilders.in/api/v1"
          TAG="${{ steps.tag.outputs.tag }}"

          # Upsert IMAGE_TAG env on the service (compose interpolates it)
          HTTP=$(curl -s -o /tmp/env-resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "{\"key\":\"IMAGE_TAG\",\"value\":\"$TAG\"}" "$BASE/services/$SVC/envs") || true
          if [ "$HTTP" != "200" ]; then
            curl -sf -X PATCH \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              -H "Content-Type: application/json" -H "Accept: application/json" \
              -d "{\"key\":\"IMAGE_TAG\",\"value\":\"$TAG\"}" "$BASE/services/$SVC/envs" > /dev/null
          fi

          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Accept: application/json" \
            "$BASE/services/$SVC/restart"
          echo "deploy queued with IMAGE_TAG=$TAG"

      - name: Run migrations (owner URL inside the api container)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new deploy@187.126.115.174 \
            'docker exec shadhil-api-0bjahklz8gtdtr4do4r7ae6m sh -lc "cd /app/packages/database && node node_modules/prisma/build/index.js migrate deploy"'