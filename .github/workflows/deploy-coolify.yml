name: deploy-coolify

# Builds the three production images and redeploys the Coolify service.
#
# Design (locked 2026-10-01): the VPS does NOT hold GHCR credentials.
# The workflow pushes images to ghcr.io/<owner>/* (for portability) and
# ALSO transfers the freshly-built images straight to the VPS over SSH
# (docker save | docker load) BEFORE touching Coolify - so the restart
# finds the exact local tags and never needs to pull. Deploy = PATCH the
# service's IMAGE_TAG env, restart, wait for health, then run migrations
# inside the api container (compose resources don't run migrations on boot).
#
# COMPOSE SYNC (added 2026-10-01). This workflow used to only PATCH
# IMAGE_TAG + restart - it never uploaded docker/coolify-compose.yml.
# Coolify stores the stack as `docker_compose_raw` on the service, so prod
# could drift arbitrarily from this file: editing the compose had NO effect,
# yet a push touching `docker/**` still fired a GREEN deploy that changed
# nothing. Commit fb0e73b (healthchecks) hit exactly that failure mode.
# Now the compose is written before the restart and read back AFTER it, so a
# green run means the definition actually landed. The verify runs last on
# purpose: a compose-sync problem must never stop app code from shipping.
#
# TEST-TENANT SEED (fixed 2026-10-10). This workflow used to run
# `scripts/seed-test-user.ts` inside the api container on EVERY push-to-main
# deploy. That was harmless while the script only created the test tenant, but
# it is an UPSERT: once it carried real data (users, leads, bookings, visits) a
# routine deploy RESET the test org and silently discarded any change made
# through the UI. It was also the only step that could fail AFTER a successful
# ship. The seed is now opt-in - dispatch this workflow with
# `seed_test_tenant=true` to (re)create the tenant on a fresh database. A
# routine deploy runs migrations only.
#
# Repo secrets (set once):
#   COOLIFY_TOKEN - API token scoped write+deploy
#   VPS_SSH_KEY   - private key of the non-root `deploy` VPS user

on:
  workflow_dispatch:
    inputs:
      disable_cache:
        description: 'Disable the Docker build cache for this run'
        type: boolean
        default: false
      seed_test_tenant:
        description: 'Also re-apply the test-tenant seed (scripts/seed-test-user.ts) after the deploy'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker/**'
      - '.github/workflows/deploy-coolify.yml'

concurrency:
  group: deploy-coolify
  cancel-in-progress: false

jobs:
  # 1. Cheap gate: fail fast on a malformed compose before spending 20+ min
  #    building images. (The sync step re-checks right before uploading.)
  validate-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Parse docker/coolify-compose.yml
        run: docker compose -f docker/coolify-compose.yml config -q

  # 2. Build the three images in parallel and push the immutable
  #    prod-<sha> tag to GHCR. The moving 'prod' tag is NOT refreshed here:
  #    that happens in the deploy job only after ALL three builds succeeded,
  #    so a partial failure never moves 'prod'.
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api
            dockerfile: apps/backend/Dockerfile
            build_args: ''
          - service: sse
            dockerfile: apps/realtime-sse/Dockerfile
            build_args: ''
          - service: web
            dockerfile: apps/web/Dockerfile
            build_args: |
              NEXT_PUBLIC_APP_URL=https://crm.shadhilbuilders.in
              NEXT_PUBLIC_API_BASE_URL=https://api.crm.shadhilbuilders.in
              NEXT_PUBLIC_BETTER_AUTH_URL=https://crm.shadhilbuilders.in
              BACKEND_API_URL=http://shadhil-api:8080
              BUILD_ID=${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "tag=prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Build cache (GitHub Actions cache, one scope per service). Disable by
      # EITHER: repo variable DISABLE_BUILD_CACHE=true (permanent), or the
      # 'disable_cache' input on a manual run (one-off).
      - name: Resolve build cache settings
        id: cache
        env:
          DISABLE_VAR: ${{ vars.DISABLE_BUILD_CACHE }}
          DISABLE_INPUT: ${{ inputs.disable_cache }}
        run: |
          set -euo pipefail
          if [ "$DISABLE_VAR" = "true" ] || [ "$DISABLE_INPUT" = "true" ]; then
            echo "build cache DISABLED"
            echo "from=" >> "$GITHUB_OUTPUT"
            echo "to=" >> "$GITHUB_OUTPUT"
          else
            echo "build cache enabled (scope=${{ matrix.service }})"
            echo "from=type=gha,scope=${{ matrix.service }}" >> "$GITHUB_OUTPUT"
            echo "to=type=gha,scope=${{ matrix.service }},mode=max" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          build-args: ${{ matrix.build_args }}
          tags: ghcr.io/${{ github.repository_owner }}/shadhil-crm-${{ matrix.service }}:${{ steps.tag.outputs.tag }}

  # 3. Serialized deploy: pull the exact built images, side-load them to the
  #    VPS (it holds no GHCR credentials), sync compose, restart, migrate, prune.
  deploy:
    needs: [validate-compose, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "tag=prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Pull built images and refresh the moving 'prod' tag
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          OWNER="${{ github.repository_owner }}"
          for s in api sse web; do
            docker pull "ghcr.io/$OWNER/shadhil-crm-$s:$TAG"
            docker tag "ghcr.io/$OWNER/shadhil-crm-$s:$TAG" "ghcr.io/$OWNER/shadhil-crm-$s:prod"
            docker push "ghcr.io/$OWNER/shadhil-crm-$s:prod"
          done

      - name: Prepare SSH key + VPS ssh wrappers
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

          # Two wrappers, both failing FAST. Without an explicit
          # ConnectTimeout a blackholed runner->VPS path (SYN silently
          # dropped upstream: nothing appears in the VPS's sshd journal AND
          # nothing in ufw.log, so it is invisible from the box) burns the
          # kernel default ~135s of SYN retries and then kills the job,
          # leaving prod on the PREVIOUS images - exactly the 2026-10-10
          # 11:52Z failure. ConnectTimeout=20 turns that into a 20s failure,
          # and ServerAliveInterval keeps the long docker-save pipe from
          # dying silently mid-stream (the 'Broken pipe ~13 min in' signature).
          cat > "$HOME/.ssh/vps_ssh" <<'EOF'
          #!/usr/bin/env bash
          # One connection, strict timeouts. Use for streamed transfers and
          # for anything that must not be silently replayed.
          exec ssh -i "$HOME/.ssh/vps_key" -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            deploy@187.126.115.174 "$@"
          EOF
          cat > "$HOME/.ssh/vps_ssh_retry" <<'EOF'
          #!/usr/bin/env bash
          # Same, but retries the CONNECT phase up to 3 times. Only for short,
          # idempotent commands (probes, docker ps/images, prisma migrate
          # deploy) - never for a 10+ minute image stream.
          set -o pipefail
          for attempt in 1 2 3; do
            "$HOME/.ssh/vps_ssh" "$@" && exit 0
            rc=$?
            echo "vps ssh attempt $attempt failed (rc=$rc); retrying in 15s" >&2
            sleep 15
          done
          echo "::error::could not reach 187.126.115.174:22 after 3 attempts - check the VPS is up and that GitHub runner ranges are not blocked on port 22" >&2
          exit 1
          EOF
          chmod +x "$HOME/.ssh/vps_ssh" "$HOME/.ssh/vps_ssh_retry"
          echo "$HOME/.ssh" >> "$GITHUB_PATH"

      - name: Transfer images to the VPS (docker save | docker load)
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          OWNER="${{ github.repository_owner }}"

          # Fail fast (and loudly) if the path is down, BEFORE spending
          # minutes on a transfer that cannot land.
          vps_ssh_retry 'echo "vps reachable: $(hostname) $(date -u +%FT%TZ)"'

          for s in api sse web; do
            IMG="ghcr.io/$OWNER/shadhil-crm-$s:$TAG"
            echo "transferring $IMG"
            docker save "$IMG" | gzip | vps_ssh 'gunzip | docker load'
          done

          # Assert ALL THREE tags landed. The old `docker images | grep | head`
          # only printed, so a missing image stayed invisible until Coolify
          # restarted onto a stale (or absent) local tag.
          if ! LANDED="$(vps_ssh_retry "docker images --format '{{.Repository}}:{{.Tag}}'")"; then
            echo "::error::could not list images on the VPS - see the ssh attempts above"
            exit 1
          fi
          echo "$LANDED" | grep -F 'shadhil-crm-' | head -12
          for s in api sse web; do
            echo "$LANDED" | grep -qx "ghcr.io/$OWNER/shadhil-crm-$s:$TAG" \
              || { echo "::error::image ghcr.io/$OWNER/shadhil-crm-$s:$TAG did not land on the VPS"; exit 1; }
          done

      - name: Sync docker-compose definition to Coolify
        id: compose
        run: |
          set -euo pipefail
          SVC="0bjahklz8gtdtr4do4r7ae6m"
          BASE="https://coolify.shadhilbuilders.in/api/v1"
          AUTH="Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

          # Local parse check BEFORE uploading. If this fails we must NOT push
          # a broken compose to prod. `config -q` needs no env values because
          # it skips interpolation; a genuinely malformed file still errors.
          docker compose -f docker/coolify-compose.yml config -q
          echo "compose parses locally"

          # Coolify takes the compose base64-encoded in `docker_compose_raw`.
          # Use `base64 -w0` for ONE line: the wrapped form would embed
          # newlines in the JSON string and Coolify would store a corrupt
          # document.
          B64=$(base64 -w0 docker/coolify-compose.yml)
          printf '{"docker_compose_raw":"%s"}' "$B64" > /tmp/compose-body.json
          echo "payload bytes: $(wc -c < /tmp/compose-body.json)"

          HTTP=$(curl -sS -o /tmp/compose-resp.json -w "%{http_code}" -X PATCH \
            -H "$AUTH" -H "Content-Type: application/json" -H "Accept: application/json" \
            --data-binary @/tmp/compose-body.json \
            "$BASE/services/$SVC") || true
          echo "PATCH /services/$SVC -> HTTP $HTTP"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "--- response body ---"
            head -c 2000 /tmp/compose-resp.json || true
            echo
            echo "::error::compose sync FAILED (HTTP $HTTP) - prod still holds the previous definition"
            exit 1
          fi
          echo "compose definition pushed"

      - name: Update IMAGE_TAG + restart the Coolify service
        run: |
          set -euo pipefail
          SVC="0bjahklz8gtdtr4do4r7ae6m"
          BASE="https://coolify.shadhilbuilders.in/api/v1"
          TAG="${{ steps.tag.outputs.tag }}"
          AUTH="Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

          # upsert IMAGE_TAG: POST creates (200), any other status falls
          # through to PATCH (the env may already exist)
          HTTP=$(curl -s -o /tmp/env-resp.json -w "%{http_code}" -X POST \
            -H "$AUTH" -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "{\"key\":\"IMAGE_TAG\",\"value\":\"$TAG\"}" \
            "$BASE/services/$SVC/envs") || true
          if [ "$HTTP" != "200" ]; then
            curl -sf -X PATCH \
              -H "$AUTH" -H "Content-Type: application/json" -H "Accept: application/json" \
              -d "{\"key\":\"IMAGE_TAG\",\"value\":\"$TAG\"}" \
              "$BASE/services/$SVC/envs" > /dev/null
          fi
          curl -sf -X POST -H "$AUTH" -H "Accept: application/json" \
            "$BASE/services/$SVC/restart"
          echo "deploy queued with IMAGE_TAG=$TAG"

      - name: Wait for the stack + run migrations
        env:
          # OPT-IN ONLY. Seeding the test tenant is an UPSERT that RESETS its
          # rows to the seeded state, so running it on a routine push-to-main
          # deploy would silently overwrite any manual change made through the
          # UI (a moved lead, a recorded token). It is also the only step here
          # that can fail AFTER a successful ship, turning a green deploy red.
          # `inputs` is empty on a push event, so this is false there; dispatch
          # the workflow with seed_test_tenant=true to (re)create the tenant on
          # a fresh database.
          SEED_TEST_TENANT: ${{ inputs.seed_test_tenant }}
        run: |
          set -euo pipefail
          # vps_ssh = strict ConnectTimeout, no inner retry: this loop IS the
          # retry (30 x 10s). Without it a blackholed path makes each poll
          # block for the kernel default ~135s.
          for i in $(seq 1 30); do
            sleep 10
            if vps_ssh 'docker ps --format "{{.Names}} {{.Status}}" | grep -q "shadhil-api.* Up "' 2>/dev/null; then
              echo "api container up after ~$((i*10))s"
              vps_ssh 'docker exec shadhil-api-0bjahklz8gtdtr4do4r7ae6m sh -lc "cd /app/packages/database && node node_modules/prisma/build/index.js migrate deploy"'
              if [ "${SEED_TEST_TENANT}" = "true" ]; then
                echo "seed_test_tenant=true - re-applying the test-tenant seed"
                vps_ssh 'docker exec shadhil-api-0bjahklz8gtdtr4do4r7ae6m sh -lc "cd /app/packages/database && npx tsx --env-file-if-exists=/dev/null scripts/seed-test-user.ts"'
              else
                echo "skipping the test-tenant seed (manual dispatch with seed_test_tenant=true re-applies it)"
              fi
              exit 0
            fi
          done
          vps_ssh 'docker ps -a --format "{{.Names}} {{.Status}}" | head -10'
          echo "api container did not come up in 300s"; exit 1

  # 4. Runs LAST, even if deploy failed, and only warns.
  verify-compose:
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Runs LAST, and only warns: app code must ship even when Coolify's
      # compose round-trip misbehaves. This closes the hole that made fb0e73b
      # look deployed when nothing had changed.
      #
      # Compare NORMALIZED, not raw. Coolify stores `docker_compose_raw` as
      # re-serialized YAML: it strips every comment (0 vs 19 in the repo file)
      # and re-quotes scalars (`image: 'postgres:16-alpine'`), so a byte or even
      # a plain-YAML comparison ALWAYS reports a mismatch - verified against the
      # live service on 2026-10-01. `docker compose config` resolves both sides
      # into the same canonical form; pinning -p keeps the project name out of
      # the diff (compose derives it from the directory, which differs between
      # the checkout and /tmp). python3 is already used in this workflow, so no
      # pyyaml dependency is needed. Keep the python one-liners SINGLE-LINE: a
      # multi-line heredoc inside a `run: |` block scalar must be indented, and
      # Python rejects a uniformly-indented script ("unexpected indent").
      - name: Verify the compose actually landed
        run: |
          set -uo pipefail
          SVC="0bjahklz8gtdtr4do4r7ae6m"
          BASE="https://coolify.shadhilbuilders.in/api/v1"
          AUTH="Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
          rm -f /tmp/stored-raw.yml

          if ! curl -sS -H "$AUTH" -H "Accept: application/json" \
                 "$BASE/services/$SVC" -o /tmp/svc.json; then
            echo "::warning::could not read the service back - compose sync UNVERIFIED"
            exit 0
          fi

          python3 -c "import base64,json;d=json.load(open('/tmp/svc.json'));open('/tmp/stored-raw.yml','w').write(base64.b64decode(d.get('docker_compose_raw') or '').decode('utf-8','replace'))" 2>/dev/null || true
          if [ ! -s /tmp/stored-raw.yml ]; then
            echo "::warning::Coolify returned no readable docker_compose_raw - compose sync UNVERIFIED"
            exit 0
          fi

          # Canonicalize both sides. -p pins the project name (compose otherwise
          # derives it from the directory name). `tail -n +2` drops the line-1
          # `name:` field, the only other environment-dependent part.
          if ! docker compose -p coolify-shadhil -f /tmp/stored-raw.yml config > /tmp/stored.norm 2>/dev/null; then
            echo "::warning::the compose Coolify is storing does not parse - inspect the service"
            exit 0
          fi
          docker compose -p coolify-shadhil -f docker/coolify-compose.yml config > /tmp/repo.norm 2>/dev/null

          if diff -q <(tail -n +2 /tmp/stored.norm) <(tail -n +2 /tmp/repo.norm) >/dev/null; then
            echo "compose VERIFIED: Coolify's stored definition matches docker/coolify-compose.yml"
          else
            echo "::warning::compose MISMATCH - the running stack does NOT match docker/coolify-compose.yml"
            echo '("<" = what Coolify has, ">" = what this commit expects)'
            diff <(tail -n +2 /tmp/stored.norm) <(tail -n +2 /tmp/repo.norm) | head -60 || true
          fi
