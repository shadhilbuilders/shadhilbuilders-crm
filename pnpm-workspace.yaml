packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 - approve build scripts for these specific packages.
# Without this, pnpm 11 ignores Prisma client generation and esbuild native
# binary setup, which breaks `pnpm db:generate` and `pnpm build`.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  unrs-resolver: true
  "@scarf/scarf": true

minimumReleaseAgeExclude:
  - '@paalstack/react-ui@1.3.1 || 1.4.0 || 1.4.1 || 1.4.2 || 1.5.0 || 1.5.1 || 1.6.0 || 1.6.1 || 1.6.2 || 1.7.0'
  - '@paalstack/react-hooks@1.1.2'
  - '@paalstack/react-icons@1.1.1'
  - '@nestjs/platform-express@12.1.1'
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - turbo@2.11.7

overrides:
  # eslint-config-next (transitively) pins eslint-plugin-react@7.37.5,
  # whose peer range caps at eslint ^9.7. Nothing in this repo's flat
  # configs imports the React plugins, so the pair is inert - keep the
  # (already-latest) plugin and silence the stale peer range so the
  # eslint 10 upgrade doesn't fail resolution.
  'eslint-plugin-react': '7.37.5'

  # ── Dependabot 2026-09-03 - security floor (T-G8 sibling). ─────────────
  # Pinned transitive-dep versions to clear 4 high + 3 medium advisories:
  #   browserslist   CVE-2026-73088 + CVE-2026-73089 (memory growth / RCE)
  #   deepmerge-ts   CVE-2026-40345 (stack exhaustion)
  #   mysql2         cleartext credential leak (auth plugin downgrade)
  #   qs             CVE-2026-82417 + CVE-2026-82562 (DoS, array-limit bypass)
  # Dependabot should auto-close the alerts once the lockfile reflects
  # these versions. Re-evaluate when new fixed releases ship - these
  # pins may lag behind.
  'browserslist': '4.28.7'
  'deepmerge-ts': '8.0.0'
  'mysql2': '3.23.1'
  'qs': '6.16.0'

  # ── Dependabot #12 (GHSA-w5hq-g745-h8pq) - uuid buffer bounds check. ──
  # uuid < 11.1.1 lacks a buffer-bounds guard on the v3/v5/v6 API methods.
  # It's a TRANSITIVE dep of imagekit@6.0.0 (which pins uuid ^8.3.2). The
  # backend pulls imagekit purely for storage and imagekit's only UUID call
  # is uuid.v4() (see imagekit/dist/libs/signature) - v4 already throws
  # RangeError on bad bounds, so this is inert at runtime. Override to the
  # first patched version; imagekit's `require("uuid")` resolves the CJS
  # build that v11.1.1 still ships. Re-evaluate when imagekit bumps the
  # range itself.
  'uuid': '11.1.1'

  # multer: no override. @nestjs/platform-express@12.1.0 bumped its own pin to
  # the patched 2.4.0 line (GHSA-3pph-fpjx-jg34), so the FIX is the parent bump
  # in apps/backend/package.json - an override would just mask a stale parent.
  # Re-check if the parent's range ever regresses.

  # ── Dependabot 2026-09-29 - three open advisories. ─────────────────────
  # fast-uri: SUPERSEDED 2026-09-30 by GHSA-hrr3-gc8f-f4qj (moderate,
  # inconsistent host case normalization via percent-encoded octets), which
  # affects >= 3.0.0 < 3.1.8 - so the previous 3.1.7 pin is no longer the
  # patched line. Moved to 3.1.8. Declared range is `^3.0.1` by ajv@8.20.0, so
  # this only forces a re-resolve inside a legal bound.
  #
  # CORRECTION to the note this replaces: fast-uri IS reachable from the runtime
  # graph, not dev-only. `pnpm why fast-uri` shows 7 paths through
  # `dependencies`, via better-auth -> @better-auth/prisma-adapter -> prisma ->
  # @prisma/dev -> @prisma/streams-local -> ajv. It is also a dev-toolchain dep
  # (via @nestjs/cli). The earlier "DEV toolchain dep here, not in the runtime
  # graph" comment was wrong; treat findings here as runtime-reachable.
  'fast-uri': '3.1.8'

  # brace-expansion GHSA-6j4f-fj2g-mc7p (high, stack exhaustion in
  # parseCommaParts), GHSA-qhr7-859c-m2p7 (high, recursion on nested brace
  # groups) and GHSA-q2hr-2g5m-vwhr (moderate, quadratic `{a},b}` rewrite) -
  # three advisories against TWO installed majors, so each key is scoped to its
  # own line rather than dragging either across a major boundary:
  #
  #   1.1.18  <- minimatch@3.1.5  (declares ^1.1.7)   dev: eslint plugins,
  #                                                   @nestjs/cli
  #   5.0.9   <- minimatch@10.2.6 (declares ^5.0.8)   dev: eslint@10
  #
  # 1.1.21 and 5.0.12 are the first versions clearing all three on their line,
  # and both fit their parent's declared range - safe by construction, no major
  # jump. Both copies are DEV-only (lint tooling), so the practical exposure was
  # a slow/hung lint run, not a served request; fixed anyway.
  'brace-expansion@>=1 <2': '1.1.21'
  'brace-expansion@>=5 <6': '5.0.12'

  # undici GHSA-3wwx-pv8p-q78v (MEDIUM, CVE-2026-85024): WebSocket
  # permessage-deflate decompression DoS. Its affected range is
  # ">= 8.1.0, < 8.10.2" - so ONLY the 8.x copy is vulnerable.
  # Two are installed: 7.29.1 (cheerio, prod, declared ^7.19.0) and 8.10.0
  # (jsdom, dev, declared ^8.9.0). 7.x was never in the affected range, so it
  # is deliberately left alone rather than dragged across a major boundary to
  # satisfy a scanner. Only 8.x moves, to the first patched version - which
  # fits jsdom's own declared range.
  'undici@>=8 <9': '8.10.2'
