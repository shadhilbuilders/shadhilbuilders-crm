packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 — approve build scripts for these specific packages.
# Without this, pnpm 11 ignores Prisma client generation and esbuild native
# binary setup, which breaks `pnpm db:generate` and `pnpm build`.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  unrs-resolver: true
  "@scarf/scarf": true

minimumReleaseAgeExclude:
  - '@paalstack/react-ui@1.3.1 || 1.4.0 || 1.4.1'
  - '@paalstack/react-hooks@1.1.2'
  - '@paalstack/react-icons@1.1.1'

overrides:
  # eslint-config-next (transitively) pins eslint-plugin-react@7.37.5,
  # whose peer range caps at eslint ^9.7. Nothing in this repo's flat
  # configs imports the React plugins, so the pair is inert — keep the
  # (already-latest) plugin and silence the stale peer range so the
  # eslint 10 upgrade doesn't fail resolution.
  'eslint-plugin-react': '7.37.5'

  # ── Dependabot 2026-09-03 — security floor (T-G8 sibling). ─────────────
  # Pinned transitive-dep versions to clear 4 high + 3 medium advisories:
  #   browserslist   CVE-2026-73088 + CVE-2026-73089 (memory growth / RCE)
  #   deepmerge-ts   CVE-2026-40345 (stack exhaustion)
  #   mysql2         cleartext credential leak (auth plugin downgrade)
  #   qs             CVE-2026-82417 + CVE-2026-82562 (DoS, array-limit bypass)
  # Dependabot should auto-close the alerts once the lockfile reflects
  # these versions. Re-evaluate when new fixed releases ship — these
  # pins may lag behind.
  'browserslist': '4.28.7'
  'deepmerge-ts': '8.0.0'
  'mysql2': '3.23.1'
  'qs': '6.16.0'
