; PgBouncer config for Shadhil Builders CRM.
; Eng review A5: pool_mode MUST be 'session' (transaction breaks RLS).

[databases]
shadhil_crm = host=postgres port=5432 dbname=shadhil_crm auth_user=shadhil

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Eng review A5: REQUIRED for RLS. Transaction pooling silently breaks
; per-request SET LOCAL session variables.
pool_mode = session

max_client_conn = 1000
; 60, not 25 (2026-11-27). The API runs a Prisma pool of 16 and the SSE
; poller one of 12; at 25 the pooler would have queued them. Postgres allows
; 300 backends and idle load is a dozen connections.
default_pool_size = 60
min_pool_size = 5
reserve_pool_size = 5
server_idle_timeout = 600
server_lifetime = 3600
