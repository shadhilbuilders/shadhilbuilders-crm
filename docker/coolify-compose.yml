# Shadhil Builders CRM - production stack for Coolify.
# Shipped as ONE Docker-Compose application (project "My first project", env
# production, server localhost). Images are prebuilt on GHCR; Coolify pulls.
# Infra mounts live under /data/coolify/shadhil/ (staged separately).

services:
  shadhil-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shadhil
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: shadhil_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /data/coolify/shadhil/postgres-init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=4MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadhil -d shadhil_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  shadhil-pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    environment:
      AUTH_TYPE: scram-sha-256
      DB_USER: shadhil
      DB_PASSWORD: ${PG_PASSWORD}
      DB_HOST: shadhil-postgres
      DB_PORT: "5432"
      DB_NAME: shadhil_crm
    volumes:
      - /data/coolify/shadhil/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - /data/coolify/shadhil/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    # pg_isready ships with the edoburu image and is protocol-level (it
    # completes the Postgres handshake), so exit 0 means the pooler is really
    # ACCEPTING connections. Measured: 6432 -> exit 0, a non-pg port -> exit 2.
    # -U is required; pgbouncer rejects a userless probe.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U shadhil"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      shadhil-postgres:
        condition: service_healthy

  shadhil-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  shadhil-api:
    image: ghcr.io/shadhilbuilders/shadhil-crm-api:${IMAGE_TAG:-prod-5f02691}
    restart: unless-stopped
    environment: &api_env
      NODE_ENV: production
      API_PORT: "8080"
      POOL_MODE: session
      DATABASE_URL: postgresql://shadhil_app:${PG_PASSWORD}@shadhil-pgbouncer:6432/shadhil_crm?schema=public
      DIRECT_DATABASE_URL: postgresql://shadhil:${PG_PASSWORD}@shadhil-postgres:5432/shadhil_crm?schema=public
      REDIS_URL: redis://shadhil-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: shadhil-crm
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://api.crm.shadhilbuilders.in
      CORS_ORIGINS: https://crm.shadhilbuilders.in
      PUBLIC_API_KEY: ${PUBLIC_API_KEY}
      PUBLIC_ORG_ID: ceid01lpfe1esm8jwsxid41k28
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.crm.shadhilbuilders.in`)"
      - "traefik.http.routers.api.priority=2000"
      - "traefik.http.routers.api.entrypoints=https"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.hsts-label.headers.stsseconds=63072000"
      - "traefik.http.middlewares.hsts-label.headers.stsincludesubdomains=true"
      - "traefik.http.middlewares.hsts-label.headers.stspreload=true"
      - "traefik.http.middlewares.hsts-label.headers.customframeoptionsvalue=DENY"
      - "traefik.http.middlewares.hsts-label.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.hsts-label.headers.referrerpolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.api.middlewares=hsts-label"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    # /api/health is @Public() and returns {status:'ok'} - verified live at
    # https://api.crm.shadhilbuilders.in/api/health (200, uptimeSec present).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      shadhil-postgres:
        condition: service_healthy
      shadhil-pgbouncer:
        # Was absent, and in the dev file it was service_started - which only
        # means "container created", so the api could hit pgbouncer before it
        # finished SCRAM negotiation. A healthcheck on the pooler makes this a
        # real gate.
        condition: service_healthy
      shadhil-redis:
        condition: service_healthy

  shadhil-web:
    image: ghcr.io/shadhilbuilders/shadhil-crm-web:${IMAGE_TAG:-prod-5f02691}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SSE_BACKEND_URL: http://shadhil-realtime-sse:8090
      DATABASE_URL: postgresql://shadhil_app:${PG_PASSWORD}@shadhil-pgbouncer:6432/shadhil_crm?schema=public
      DIRECT_DATABASE_URL: postgresql://shadhil:${PG_PASSWORD}@shadhil-postgres:5432/shadhil_crm?schema=public
      BACKEND_API_URL: http://shadhil-api:8080
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://crm.shadhilbuilders.in
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: shadhil-crm
      NEXT_PUBLIC_API_BASE_URL: https://api.crm.shadhilbuilders.in
      NEXT_PUBLIC_BETTER_AUTH_URL: https://crm.shadhilbuilders.in
      NEXT_PUBLIC_APP_URL: https://crm.shadhilbuilders.in
      NEXT_PUBLIC_APP_NAME: Shadhil Builders
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm.rule=Host(`crm.shadhilbuilders.in`)"
      - "traefik.http.routers.crm.priority=2000"
      - "traefik.http.routers.crm.entrypoints=https"
      - "traefik.http.routers.crm.tls=true"
      - "traefik.http.routers.crm.tls.certresolver=letsencrypt"
      - "traefik.http.routers.crm.middlewares=hsts-label"
      - "traefik.http.services.crm.loadbalancer.server.port=3000"
    # /api/health route handler, no session needed - verified live at
    # https://crm.shadhilbuilders.in/api/health (200, environment=production).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      shadhil-api:
        condition: service_healthy
      shadhil-realtime-sse:
        condition: service_healthy

  shadhil-realtime-sse:
    image: ghcr.io/shadhilbuilders/shadhil-crm-sse:${IMAGE_TAG:-prod-5f02691}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REALTIME_SSE_PORT: "8090"
      CORS_ORIGINS: https://crm.shadhilbuilders.in
      DATABASE_URL: postgresql://shadhil_app:${PG_PASSWORD}@shadhil-pgbouncer:6432/shadhil_crm?schema=public
      POOL_MODE: session
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sse.rule=Host(`sse.crm.shadhilbuilders.in`)"
      - "traefik.http.routers.sse.priority=2000"
      - "traefik.http.routers.sse.entrypoints=https"
      - "traefik.http.routers.sse.tls=true"
      - "traefik.http.routers.sse.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sse.middlewares=no-sse-compress"
      - "traefik.http.middlewares.no-sse-compress.compress=true"
      - "traefik.http.middlewares.no-sse-compress.compress.excludedcontenttypes=text/event-stream"
      - "traefik.http.routers.sse.middlewares=no-sse-compress,hsts-label"
      - "traefik.http.services.sse.loadbalancer.server.port=8090"
    # Dedicated liveness route (server.ts) -> {"ok":true,...}. Verified live at
    # https://sse.crm.shadhilbuilders.in/api/sse/healthz (200). Note /api/sse/
    # metrics is deliberately NOT proxied, so probes must be in-container.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8090/api/sse/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      shadhil-postgres:
        condition: service_healthy
      shadhil-pgbouncer:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
