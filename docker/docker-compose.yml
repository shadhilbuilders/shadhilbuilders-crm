# Shadhil Builders CRM - Docker Compose for VPS deployment
#
# Per plan §10 (Coolify on Hostinger VPS 8GB India region). This file is the
# Phase 1 reference config - the actual production deploy happens in Week 12
# via Coolify auto-deploy from GitHub.
#
# Services:
#   postgres      Postgres 16 with max_connections=300 (eng review P1, 150-user cap)
#   pgbouncer     PgBouncer in session pooling mode (eng review A5 - REQUIRED for RLS)
#   redis         Redis 7 (SSE pub/sub + cron locks + rate limiting)
#   api           NestJS 12 backend (port 8080)
#   web           Next.js 16 frontend (port 3000)
#   realtime-sse  standalone SSE service (port 8090)
#
# 2026-10-01 (eng review F3/F5/F8): `web` and `realtime-sse` were stubs/comments
# here while their Dockerfiles were missing, so the stack could not come up
# whole. Both Dockerfiles now exist and are built in CI. The three app services
# carry the Traefik label sets from
# skills/devops/shadhil-crm-dev/references/prod-deployment.md; when Coolify
# manages the proxy it sets those labels itself, so they are inert-but-harmless
# here (they only take effect if a `traefik` service is on the same network).
#
# Reverse proxy is TRAEFIK (Coolify's default) - Decision Audit #36. Do not
# introduce Caddy or nginx.
#
# Hostnames are `${...:-default}` so this ONE file serves both purposes: Coolify's
# production deploy (defaults) and a local Traefik run (override in .env, e.g.
# CRM_HOST=crm.local). The labels are inert when no Traefik container shares the
# network, which is why `docker compose up postgres pgbouncer api` still works
# standalone. Coolify sets its own labels when it manages the proxy.
#
# RELIABILITY: every service uses `restart: unless-stopped`, so a crashed
# container comes back on its own.
#
# HEALTHCHECKS (added 2026-10-01): every service now declares one. Note what a
# healthcheck does and does NOT do here - `unless-stopped` only reacts to a
# container whose PROCESS EXITS. Docker does not restart an UNHEALTHY container
# (that is a Swarm/compose `--wait` behaviour, not a restart policy). So a probe
# buys two things:
#   1. visibility - `docker ps` shows the real state instead of a hardcoded
#      "no healthcheck" pass.
#   2. a startup GATE - depends_on can wait for `service_healthy` instead of
#      `service_started`. That is what closes the api/pgbouncer race below.
# It does NOT recycle a wedged-but-running app; that still needs a supervisor.
#
# Log rotation is still the VPS daemon's job: without it a crash-looping
# container fills the disk and takes the whole stack down with it. Set it
# daemon-wide:
#   /etc/docker/daemon.json
#   {"log-driver":"json-file","log-opts":{"max-size":"50m","max-file":"5"}}
#
# Probe style: the three app images are node:22-alpine, which ships busybox
# wget and NO curl. busybox wget has no --fail flag, but it exits non-zero on
# any HTTP error - verified against the live endpoints: 200 -> exit 0,
# 404 -> exit 1, connection refused -> exit 1. All probes target 127.0.0.1;
# every service binds 0.0.0.0 in-container.
#
# Usage:
#   docker compose -f docker/docker-compose.yml config   # validate
#   docker compose -f docker/docker-compose.yml up -d   # start
#   docker compose -f docker/docker-compose.yml logs -f # tail logs

services:
  postgres:
    image: postgres:16-alpine
    container_name: shadhil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shadhil
      POSTGRES_PASSWORD: shadhil
      POSTGRES_DB: shadhil_crm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    command:
      # eng review P1: max_connections=300 supports ~150 concurrent users
      # (2 SSE streams/user × 150 = 300 backend sessions).
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=4MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadhil -d shadhil_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    # edoburu/pgbouncer - actively maintained, CVE-patched upstream images.
    # Bitnami moved bitnami/* behind a paid subscription in Aug 2025; the
    # bitnamilegacy/* namespace is frozen at the version pinned and never
    # receives security updates.
    #
    # SWITCHED from bitnamilegacy 2026-08-31 (verified live before swap):
    # - bitnami IGNORES the mounted docker/pgbouncer.ini and generates its
    #   own from env vars - the source of the missing [databases] alias
    #   (PGBOUNCER_DATABASE defaulted to 'postgres'), which silently broke
    #   every shadhil_crm connection through the pool (see PGBOUNCER_DATABASE
    #   note below for the archaeology).
    # - edoburu's entrypoint only generates the ini when it does NOT exist
    #   (`if [ ! -f ... ]`), so our mounted docker/pgbouncer.ini is used
    #   as-is: pool_mode=session + [databases] shadhil_crm stay authoritative
    #   in a file we control. Verified: pgbouncer 1.25.2 up, client SELECT OK,
    #   SET LOCAL app.user_role inside a transaction (RLS requirement) OK.
    # - Auth file untouched: entrypoint APPENDS credentials only when the
    #   user is absent from userlist.txt.
    # DB_USER/DB_PASSWORD/DB_HOST/DB_PORT/DB_NAME exist ONLY so the
    # entrypoint can append missing userlist entries; all pool behavior
    # lives in docker/pgbouncer.ini.
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: shadhil-pgbouncer
    restart: unless-stopped
    environment:
      AUTH_TYPE: scram-sha-256
      DB_USER: shadhil
      DB_PASSWORD: shadhil
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: shadhil_crm
    ports:
      - "127.0.0.1:6432:6432"
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    # pg_isready ships with the image and is protocol-level: it completes the
    # Postgres handshake, so exit 0 means the pooler is really ACCEPTING
    # connections rather than merely listening. Measured discrimination:
    # against 6432 -> exit 0, against redis's 6379 -> exit 2.
    # -U is required: pgbouncer refuses a userless probe
    # ("no such user: <empty>"). No -d - that would need a [databases] entry
    # for it, and pg_isready already proves the pool is up.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U shadhil"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: shadhil-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: shadhil-api
    restart: unless-stopped
    env_file:
      # Compose also reads these via ${VAR:?msg} shell interpolation; the
      # env_file directive here ensures `docker compose up -d api` works
      # without exporting vars manually. The shell-expansion syntax still
      # guards BETTER_AUTH_SECRET/JWT_SECRET (compose fails fast if absent).
      - ../.env
    environment:
      NODE_ENV: production
      API_PORT: "8080"
      # Direct (admin) URL - bypasses PgBouncer. Used by migrations + RLS
      # session variable writes.
      # AR-2c: app connects as the NON-OWNER role (RLS-enforced). Owner role
      # `shadhil` is migrations/seed only (DIRECT_DATABASE_URL).
      #
      # eng review 2026-09-03: the source DATABASE_URL / DIRECT_DATABASE_URL
      # in ../.env use `localhost` (correct for host-side tooling: `pnpm
      # db:migrate`, the BFF in `pnpm dev`). From inside the api container,
      # `localhost` is the container itself, not the postgres/pgbouncer
      # services. The api container runs `sed` at start to rewrite the host
      # portion (see `command:` below) so the runtime URL points at the
      # docker-network DNS names. Source values still come from ../.env.
      # Production deploys via Coolify override this command block entirely.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required in .env}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:?DIRECT_DATABASE_URL required in .env}
      # eng review A5: MUST be 'session' - NestJS boot-time check fails otherwise.
      POOL_MODE: session
      # 24/7: Prisma defaults to a pool of 10 shared by every request, which
      # exhausts long before Postgres does (max_connections=300). Override by
      # appending ?connection_limit=20 to DATABASE_URL (plan T-PERF-2). Left
      # unset here because it should be tuned against real load, not guessed.
      REDIS_URL: redis://redis:6379
      # eng review AR-8: allowlist only. The browser origin is the web app; the
      # api host is listed because the Swagger UI is served from it.
      CORS_ORIGINS: https://${CRM_HOST:-crm.shadhilbuilders.in},http://localhost:3000,http://localhost:8081
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required (min 32 chars)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.crm.shadhilbuilders.in}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required (min 32 chars)}
      JWT_ISSUER: shadhil-crm
      # boot-env.ts REQUIRES these two (assertBootEnv fails the container
      # without them). PUBLIC_API_KEY guards the anonymous landing endpoints
      # (POST /api/public/feedback, /api/public/leads); PUBLIC_ORG_ID is the
      # tenant those synthetic-context writes land in.
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:?PUBLIC_API_KEY required (min 16 chars)}
      PUBLIC_ORG_ID: ${PUBLIC_ORG_ID:?PUBLIC_ORG_ID required (ULID or UUID)}
      # 6 inputs from §17 - placeholders work; real values via Coolify env.
      # Names mirror apps/backend/src (the WA_* convention, c7f8 commit
      # "align WhatsApp env names to committed WA_* convention"): there is no
      # WA_BUSINESS_ACCOUNT_ID -- the WABA id is not read by the backend.
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-placeholder}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN:-placeholder}
      WA_WEBHOOK_VERIFY_TOKEN: ${WA_WEBHOOK_VERIFY_TOKEN:-placeholder}
      # Signature verification on inbound webhooks (Meta app secret).
      WA_APP_SECRET: ${WA_APP_SECRET:-placeholder}
      FREJUN_API_KEY: ${FREJUN_API_KEY:-placeholder}
      FREJUN_WEBHOOK_SECRET: ${FREJUN_WEBHOOK_SECRET:-placeholder}
    # Rewrite the localhost in DATABASE_URL/DIRECT_DATABASE_URL to the
    # docker-internal DNS names (pgbouncer, postgres), then exec the
    # original NestJS start command. Idempotent - sed swaps only the host
    # segment between :// and the next :, leaving user/password/port/db/query
    # untouched. The DATABASE_URL/DIRECT_DATABASE_URL seen by the Node
    # process is the rewritten one. POSIX sed (no bash-only constructs) so
    # the alpine busybox sh in the production image handles this.
    command:
      - "sh"
      - "-c"
      - "export DATABASE_URL=$$(echo \"$$DATABASE_URL\" | sed 's|@localhost:|@pgbouncer:|') && export DIRECT_DATABASE_URL=$$(echo \"$$DIRECT_DATABASE_URL\" | sed 's|@localhost:|@postgres:|') && echo \"[entrypoint] DATABASE_URL host rewritten to $$(echo $$DATABASE_URL | sed 's|.*@|@|')\" && exec node apps/backend/dist/main.js"
    ports:
      - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_HOST:-api.crm.shadhilbuilders.in}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    # /api/health is @Public() (see apps/backend/src/health/health.module.ts)
    # and returns {status:'ok'}, so no auth is needed to probe it. Verified
    # live: 200 {"status":"ok","uptimeSec":...,"timestamp":...}.
    # start_period is generous because the process runs the entrypoint's sed
    # host-rewrite and then connects to pgbouncer/redis before serving.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        # Now a REAL gate: 'service_started' only meant the container was
        # created, so the api could race into "no auth_user" errors before
        # pgbouncer finished SCRAM negotiation. With a healthcheck on
        # pgbouncer this waits for it to actually accept connections.
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time, so
        # they must be passed here - a runtime env var is too late.
        NEXT_PUBLIC_APP_URL: https://${CRM_HOST:-crm.shadhilbuilders.in}
        NEXT_PUBLIC_API_BASE_URL: https://${API_HOST:-api.crm.shadhilbuilders.in}
        # BACKEND_API_URL is server-side but ALSO read at build time: it is
        # interpolated into next.config.ts's rewrite table. Omit it and the
        # image bakes the localhost:8080 fallback (eng review F8).
        BACKEND_API_URL: http://shadhil-api:8080
    container_name: shadhil-web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Runtime, NOT build-time: the BFF route reads process.env.SSE_BACKEND_URL
      # per request (verified in the built bundle, 2026-10-01). Same container
      # network, so the SSE service's compose name is the target.
      SSE_BACKEND_URL: http://realtime-sse:8090
      # Server-side web env (better-auth + the [orgSlug] tenant lookups).
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:?DIRECT_DATABASE_URL required in .env}
      BACKEND_API_URL: http://shadhil-api:8080
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required (min 32 chars)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://${CRM_HOST:-crm.shadhilbuilders.in}}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required (min 32 chars)}
      JWT_ISSUER: shadhil-crm
      NEXT_PUBLIC_API_BASE_URL: https://${API_HOST:-api.crm.shadhilbuilders.in}
      NEXT_PUBLIC_APP_URL: https://${CRM_HOST:-crm.shadhilbuilders.in}
      NEXT_PUBLIC_APP_NAME: Shadhil Builders
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm.rule=Host(`${CRM_HOST:-crm.shadhilbuilders.in}`)"
      - "traefik.http.routers.crm.entrypoints=websecure"
      - "traefik.http.routers.crm.tls=true"
      - "traefik.http.routers.crm.tls.certresolver=letsencrypt"
      - "traefik.http.services.crm.loadbalancer.server.port=3000"
    # /api/health is a plain route handler (apps/web/src/app/api/health/
    # route.ts) returning {status:'ok'} - no session required. Verified live:
    # 200 {"status":"ok","timestamp":...,"version":...,"environment":...}.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
      realtime-sse:
        condition: service_healthy

  realtime-sse:
    build:
      context: ..
      dockerfile: apps/realtime-sse/Dockerfile
    container_name: shadhil-realtime-sse
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      REALTIME_SSE_PORT: "8090"
      # Browser origin only - the SSE service is reached through the web BFF,
      # and the ticket in the URL is the auth credential (no cookies by
      # design; Decisions #33/#37).
      CORS_ORIGINS: https://${CRM_HOST:-crm.shadhilbuilders.in},http://localhost:3000
      # Same DB path as the api: pooled non-owner URL + session pooling.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required in .env}
      POOL_MODE: session
    # Plan §10: "Set ulimit -n 65536 on the SSE service container (the Docker
    # default 1024 will EMFILE at ~500 connections)."
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8090:8090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sse.rule=Host(`${SSE_HOST:-sse.crm.shadhilbuilders.in}`)"
      - "traefik.http.routers.sse.entrypoints=websecure"
      - "traefik.http.routers.sse.tls=true"
      - "traefik.http.routers.sse.tls.certresolver=letsencrypt"
      # CRITICAL: opt the SSE routes out of compression. Traefik's default
      # compress middleware buffers text/event-stream and breaks streaming
      # (Traefik issue #8623). No flushInterval is needed - Traefik
      # auto-detects streaming responses and flushes per frame.
      - "traefik.http.routers.sse.middlewares=no-sse-compress"
      - "traefik.http.middlewares.no-sse-compress.compress=true"
      - "traefik.http.middlewares.no-sse-compress.compress.excludedcontenttypes=text/event-stream"
      - "traefik.http.services.sse.loadbalancer.server.port=8090"
    # Dedicated liveness route in the service itself (server.ts): GET
    # /api/sse/healthz -> {"ok":true,"service":"realtime-sse"}. Unlike
    # /api/sse/metrics it is NOT proxied by Traefik, so the probe has to run
    # in-container. Verified live at the public host too: 200 with that body.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8090/api/sse/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        # Same upgrade as the api: the SSE service opens a Pool at boot, so a
        # half-ready pooler should hold it back rather than let it crash-loop.
        condition: service_healthy
    command:
      - "sh"
      - "-c"
      - "export DATABASE_URL=$$(echo \"$$DATABASE_URL\" | sed 's|@localhost:|@pgbouncer:|') && exec /app/apps/realtime-sse/node_modules/.bin/tsx --env-file-if-exists=/dev/null src/server.ts"

volumes:
  postgres_data:
  redis_data:
