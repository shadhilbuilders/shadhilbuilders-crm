; PgBouncer config, PRODUCTION copy (2026-11-27).
;
; This is the exact file the VPS mounts read-only at
; /data/coolify/shadhil/pgbouncer.ini (docker/coolify-compose.yml). It lives
; here so a rebuilt host is a copy away instead of a memory:
;
;   scp docker/pgbouncer.prod.ini root@<vps>:/data/coolify/shadhil/pgbouncer.ini
;   ssh root@<vps> 'docker kill -s HUP shadhil-pgbouncer-<svc>'
;
; A SIGHUP reloads it without dropping client sessions. Verify with
;   docker exec <pgbouncer> grep -E '^(pool_mode|default_pool_size)' /etc/pgbouncer/pgbouncer.ini
;
; pool_mode=session is REQUIRED: transaction pooling breaks the per-request
; SET LOCAL variables the RLS policies read. default_pool_size is 60 because the
; API's Prisma pool is 16 and the SSE poller's is 12 (2026-11-27); at 25 the
; pooler queued them and $transaction hit Prisma's maxWait.
[databases]
shadhil_crm = host=shadhil-postgres port=5432 dbname=shadhil_crm auth_user=shadhil

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 1000
default_pool_size = 60
min_pool_size = 5
reserve_pool_size = 5
server_idle_timeout = 600
server_lifetime = 3600
